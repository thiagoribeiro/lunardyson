<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="LunarDyson: a moon inside a metered shell">
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fb8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8fb8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#eef2f8"/>
      <stop offset="68%" stop-color="#aeb9cb"/>
      <stop offset="100%" stop-color="#7d889b"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- sphere -->
  <g transform="translate(170 150)">
    <circle r="135" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="100" fill="none" stroke="#2c3a55" stroke-width="12" opacity="0.6"/>
    <g>
      <circle r="100" fill="none" stroke="#8fb8ff" stroke-width="1" stroke-dasharray="5 6" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="100" fill="none" stroke="#8fb8ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="60 569" opacity="0.55" filter="url(#soft)"/>
      <circle r="100" fill="none" stroke="#dbe8ff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="46 583" opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="107" fill="none" stroke="#8fb8ff" stroke-width="0.7" stroke-dasharray="1 11" opacity="0.5"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="140s" repeatCount="indefinite"/>
    </g>
    <circle r="52" fill="url(#moon)"/>
    <circle cx="-17" cy="-15" r="8" fill="#97a3b7" opacity="0.7"/>
    <circle cx="17" cy="14" r="5.5" fill="#97a3b7" opacity="0.6"/>
    <circle cx="12" cy="-21" r="3.5" fill="#97a3b7" opacity="0.6"/>
    <text y="4" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#1b2230">run(input, ctx)</text>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="340" y="128" font-size="46" font-weight="800" letter-spacing="1.5" fill="#e6ebf3">LunarDyson</text>
    <text x="342" y="166" font-size="19" fill="#94a0b4">Execution runtime for untrusted Luau programs</text>
    <text x="342" y="192" font-size="19" fill="#94a0b4">that orchestrate tools.</text>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="13">
    <rect x="342" y="216" width="124" height="28" rx="7" fill="#0f1420" stroke="#8fb8ff"/>
    <text x="404" y="234" text-anchor="middle" fill="#c8d4e6">default deny</text>
    <rect x="478" y="216" width="152" height="28" rx="7" fill="#0f1420" stroke="#8fb8ff"/>
    <text x="554" y="234" text-anchor="middle" fill="#c8d4e6">typed tool calls</text>
    <rect x="642" y="216" width="174" height="28" rx="7" fill="#0f1420" stroke="#8fb8ff"/>
    <text x="729" y="234" text-anchor="middle" fill="#c8d4e6">metered everything</text>
  </g>
</svg>
