[project]
name = "lunardyson"
version = "0.1.0"
description = "Execution runtime for untrusted Luau programs that orchestrate tools"
requires-python = ">=3.10"
dependencies = ["cffi>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunardyson"]
# liblunardyson.so is copied in by scripts/build_wheel.sh
artifacts = ["lunardyson/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
