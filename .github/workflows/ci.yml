name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # RiteSmith's Luau benchmark tasks run as integration tests (public repo).
      - uses: actions/checkout@v4
        with:
          repository: thiagoribeiro/ritesmith
          path: ritesmith
          sparse-checkout: benchmarks/luau_codegen/tasks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          pip install cffi pytest
      - name: Build (Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: Python binding (unit + conformance + RiteSmith tasks)
        working-directory: bindings/python
        env:
          LUNARDYSON_LIB: ${{ github.workspace }}/build/liblunardyson.so
          LD_BENCH_TASKS: ${{ github.workspace }}/ritesmith/benchmarks/luau_codegen/tasks
        run: python -m pytest -q
      - name: Go binding (conformance)
        working-directory: bindings/go
        run: go test ./...
      - name: C smoke
        run: ./build/ld_smoke

  sanitizers:
    name: sanitizers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            flags: -DLD_SANITIZE=ON
            env: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          - name: tsan
            flags: -DLD_TSAN=ON
            env: TSAN_OPTIONS=suppressions=tsan-suppressions.txt:halt_on_error=1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.flags }} && cmake --build build
      - name: C smoke under ${{ matrix.name }}
        run: env ${{ matrix.env }} ./build/ld_smoke

  wheels:
    name: wheel (${{ matrix.arch }})
    needs: [test, sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35, GCC 11) so the wheel loads on any newer
          # glibc/libstdc++, e.g. the Debian-based python:3.12-slim images.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          pip install cffi wheel
      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('bindings/python/pyproject.toml','rb'))['project']['version'])")
          cm=$(sed -n 's/^project(lunardyson VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag python=$py cmake=$cm"
          test "$tag" = "$py" && test "$tag" = "$cm"
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLD_BUILD_TESTS=OFF && cmake --build build
      - name: Wheel
        run: ./scripts/build_wheel.sh build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install -q dist/*.whl
          /tmp/w/bin/python -c "import lunardyson as ld; r = ld.Runtime(); print(ld.version(), r.execute('function run(i) return {ok=true} end').ok)"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
